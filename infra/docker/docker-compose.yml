version: '3.9'

# =============================================================
#  AstraCommerce — Full Stack Docker Compose
#  Start:  docker-compose up -d
#  Logs:   docker-compose logs -f <service-name>
#  Stop:   docker-compose down -v
# =============================================================

networks:
  astra-net:
    driver: bridge

volumes:
  pg_user_data:
  pg_product_data:
  pg_order_data:
  pg_inventory_data:
  pg_payment_data:
  redis_data:

services:

  # ── Zookeeper ───────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks: [astra-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka ───────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks: [astra-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [astra-net]
    ports:
      - "6379:6379"
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL Databases ────────────────────────────────────
  postgres-user:
    image: postgres:15-alpine
    container_name: postgres-user
    networks: [astra-net]
    ports: ["5433:5432"]
    environment:
      POSTGRES_DB: astra_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [pg_user_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d astra_users"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-product:
    image: postgres:15-alpine
    container_name: postgres-product
    networks: [astra-net]
    ports: ["5434:5432"]
    environment:
      POSTGRES_DB: astra_products
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [pg_product_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d astra_products"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-order:
    image: postgres:15-alpine
    container_name: postgres-order
    networks: [astra-net]
    ports: ["5435:5432"]
    environment:
      POSTGRES_DB: astra_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [pg_order_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d astra_orders"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:15-alpine
    container_name: postgres-inventory
    networks: [astra-net]
    ports: ["5436:5432"]
    environment:
      POSTGRES_DB: astra_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [pg_inventory_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d astra_inventory"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:15-alpine
    container_name: postgres-payment
    networks: [astra-net]
    ports: ["5437:5432"]
    environment:
      POSTGRES_DB: astra_payments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [pg_payment_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d astra_payments"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Discovery Server ────────────────────────────────────────
  discovery-server:
    build:
      context: ../..         # root of astra-commerce
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    networks: [astra-net]
    ports: ["8761:8761"]
    environment:
      EUREKA_PASSWORD: eureka-secret
      SPRING_SECURITY_USER_NAME: eureka
      SPRING_SECURITY_USER_PASSWORD: eureka-secret
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://eureka:eureka-secret@localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ── Config Server ───────────────────────────────────────────
  config-server:
    build:
      context: ../..
      dockerfile: config-server/Dockerfile
    container_name: config-server
    networks: [astra-net]
    ports: ["8888:8888"]
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:eureka-secret@discovery-server:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://config:config-secret@localhost:8888/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ── API Gateway ─────────────────────────────────────────────
  gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    container_name: gateway
    networks: [astra-net]
    ports: ["8080:8080"]
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:eureka-secret@discovery-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: aXN0cmFjb21tZXJjZS1zdXBlci1zZWNyZXQta2V5LTI1NmJpdHMhIQ==
      SPRING_CLOUD_CONFIG_IMPORT_CHECK_ENABLED: "false"
      SPRING_CONFIG_IMPORT: "optional:configserver:"

  # ── User Service ────────────────────────────────────────────
  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    networks: [astra-net]
    ports: ["8081:8081"]
    depends_on:
      postgres-user:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/astra_users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:eureka-secret@discovery-server:8761/eureka/
      JWT_SECRET: aXN0cmFjb21tZXJjZS1zdXBlci1zZWNyZXQta2V5LTI1NmJpdHMhIQ==
      SPRING_CONFIG_IMPORT: "optional:configserver:"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Product Service ─────────────────────────────────────────
  product-service:
    build:
      context: ../..
      dockerfile: services/product-service/Dockerfile
    container_name: product-service
    networks: [astra-net]
    ports: ["8082:8082"]
    depends_on:
      postgres-product:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-product:5432/astra_products
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:eureka-secret@discovery-server:8761/eureka/
      JWT_SECRET: aXN0cmFjb21tZXJjZS1zdXBlci1zZWNyZXQta2V5LTI1NmJpdHMhIQ==
      SPRING_CONFIG_IMPORT: "optional:configserver:"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Order Service ───────────────────────────────────────────
  order-service:
    build:
      context: ../..
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    networks: [astra-net]
    ports: ["8083:8083"]
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/astra_orders
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:eureka-secret@discovery-server:8761/eureka/
      JWT_SECRET: aXN0cmFjb21tZXJjZS1zdXBlci1zZWNyZXQta2V5LTI1NmJpdHMhIQ==
      SPRING_CONFIG_IMPORT: "optional:configserver:"

  # ── Inventory Service ───────────────────────────────────────
  inventory-service:
    build:
      context: ../..
      dockerfile: services/inventory-service/Dockerfile
    container_name: inventory-service
    networks: [astra-net]
    ports: ["8084:8084"]
    depends_on:
      postgres-inventory:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-inventory:5432/astra_inventory
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:eureka-secret@discovery-server:8761/eureka/
      JWT_SECRET: aXN0cmFjb21tZXJjZS1zdXBlci1zZWNyZXQta2V5LTI1NmJpdHMhIQ==
      SPRING_CONFIG_IMPORT: "optional:configserver:"

  # ── Payment Service ─────────────────────────────────────────
  payment-service:
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    container_name: payment-service
    networks: [astra-net]
    ports: ["8085:8085"]
    depends_on:
      postgres-payment:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/astra_payments
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:eureka-secret@discovery-server:8761/eureka/
      JWT_SECRET: aXN0cmFjb21tZXJjZS1zdXBlci1zZWNyZXQta2V5LTI1NmJpdHMhIQ==
      SPRING_CONFIG_IMPORT: "optional:configserver:"

  # ── Notification Service ────────────────────────────────────
  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    networks: [astra-net]
    ports: ["8086:8086"]
    depends_on:
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:eureka-secret@discovery-server:8761/eureka/
      SPRING_CONFIG_IMPORT: "optional:configserver:"

  # ── Prometheus ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks: [astra-net]
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
