server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native       # Use classpath-based config files
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config/
  security:
    user:
      name: config
      password: ${CONFIG_PASSWORD:config-secret}

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka-secret@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
